name: Audit Windows and macOS UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Offline Windows checks
        shell: pwsh
        run: ./test-local.ps1 -TestDirectory "$env:RUNNER_TEMP/ui-checks"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-ui-audit
          path: ${{ runner.temp }}/ui-checks/*.png
          if-no-files-found: error
  macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test macOS client
        run: |
          python -m unittest test_mac_client.py test_file_channels.py -v
          python mac-client.py --smoke-test
      - name: Capture real macOS windows with offline sample data
        if: always()
        run: |
          python -m pip install pillow pyobjc-framework-Quartz
          python tools/capture_macos_ui.py --output ui-captures --label fixed --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-ui-${{ matrix.arch }}
          path: ui-captures/
          if-no-files-found: warn
