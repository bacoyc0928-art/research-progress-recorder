name: Build 0.2.0 packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test and package Windows
        shell: pwsh
        run: |
          ./test-local.ps1 -TestDirectory "$env:RUNNER_TEMP/offline-tests"
          ./package-local.ps1 -Destination "$env:RUNNER_TEMP/package-020"
          $package = "$env:RUNNER_TEMP/package-020/SRCRec"
          if ((Get-Item "$package/SRPRecorder2027.exe").VersionInfo.FileVersion -ne '0.2.0.0') { throw 'Incorrect application version' }
          if ((Get-Item "$package/卸载SRPRecorder2027.exe").VersionInfo.FileVersion -ne '0.2.0.0') { throw 'Incorrect uninstaller version' }
          $unexpected = Get-ChildItem $package -Recurse -File | Where-Object { $_.Extension -in '.pdf','.docx','.json' }
          if ($unexpected) { throw 'Private data entered the public package' }
          Copy-Item "$env:RUNNER_TEMP/package-020/research-progress-recorder-0.2.0-Windows.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-0.2.0
          path: research-progress-recorder-0.2.0-Windows.zip
          if-no-files-found: error
  macos:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test file channels and macOS GUI
        run: |
          python -m unittest test_mac_client.py test_file_channels.py -v
          python mac-client.py --smoke-test
          bash -n 卸载工具/uninstall-macos.command
      - name: Build and verify app
        run: |
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --noconfirm --clean --windowed --name ResearchProgressRecorder --osx-bundle-identifier org.syncresearch.recorder mac-client.py
          app=dist/ResearchProgressRecorder.app
          plutil -replace CFBundleShortVersionString -string 0.2.0 "$app/Contents/Info.plist"
          plutil -insert CFBundleVersion -string 0.2.0 "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          "$app/Contents/MacOS/ResearchProgressRecorder" --smoke-test
          codesign --verify --deep --strict --verbose=2 "$app"
          file "$app/Contents/MacOS/ResearchProgressRecorder"
      - name: Create and verify DMG
        run: |
          mkdir dmg-root
          ditto dist/ResearchProgressRecorder.app dmg-root/ResearchProgressRecorder.app
          ln -s /Applications dmg-root/Applications
          cp README.md dmg-root/README.md
          cp 卸载工具/uninstall-macos.command dmg-root/uninstall-macos.command
          chmod +x dmg-root/uninstall-macos.command
          image=research-progress-recorder-0.2.0-macOS-${{ matrix.arch }}.dmg
          hdiutil create -volname 'Research Progress Recorder 0.2.0' -srcfolder dmg-root -format UDZO -fs HFS+ "$image"
          hdiutil verify "$image"
          mount="$RUNNER_TEMP/verify-dmg"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$image"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount/ResearchProgressRecorder.app"
          "$mount/ResearchProgressRecorder.app/Contents/MacOS/ResearchProgressRecorder" --smoke-test
          test -x "$mount/uninstall-macos.command"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount/ResearchProgressRecorder.app/Contents/Info.plist")" = '0.2.0'
          shasum -a 256 "$image"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-0.2.0
          path: research-progress-recorder-0.2.0-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
