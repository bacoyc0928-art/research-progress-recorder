name: Build 0.0.2 packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Windows
        shell: pwsh
        run: |
          ./build.ps1
          New-Item -ItemType Directory verify -Force | Out-Null
          $sources = Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /main:Verify002 /out:verify/verify.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:Microsoft.VisualBasic.dll /r:System.Xml.dll $sources verify_002.cs
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
          & ./verify/verify.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          New-Item -ItemType Directory bundle -Force | Out-Null
          Copy-Item '研究进展记录器.exe',README.md,build.ps1,app.ico,app.manifest bundle
          Copy-Item src bundle/src -Recurse
          Compress-Archive -Path bundle/* -DestinationPath research-progress-recorder-0.0.2-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: research-progress-recorder-0.0.2-Windows.zip
  macos:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data handling and macOS GUI
        run: |
          python -m unittest test_mac_client.py -v
          python mac-client.py --smoke-test
      - name: Build app bundle
        run: |
          python -m pip install pyinstaller==6.22.3
          python -m PyInstaller --noconfirm --clean --windowed --name ResearchProgressRecorder --osx-bundle-identifier org.syncresearch.recorder mac-client.py
          dist/ResearchProgressRecorder.app/Contents/MacOS/ResearchProgressRecorder --smoke-test
          codesign --verify --deep --strict --verbose=2 dist/ResearchProgressRecorder.app
          cd dist
          ditto -c -k --sequesterRsrc --keepParent ResearchProgressRecorder.app ../research-progress-recorder-0.0.2-macOS-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: research-progress-recorder-0.0.2-macOS-${{ matrix.arch }}.zip
