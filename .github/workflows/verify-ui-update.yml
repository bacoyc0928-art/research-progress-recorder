name: Verify UI and Mac in-app update (test branch only)

on:
  push:
    branches: [claude/verify-ui-update]

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests and GUI smoke on the branch source
        run: |
          python -m unittest test_file_channels.py test_mac_client.py -v
          python mac-client.py --smoke-test
      - name: Native screenshots of the new layout
        run: |
          python -m pip install pillow pyobjc-framework-Quartz
          python tools/capture_macos_ui.py --output ui-captures --label ui-friendly --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-captures-${{ matrix.arch }}
          path: ui-captures/
          if-no-files-found: warn
      - name: In-app update from installed 0.2.11 to the latest release
        run: |
          set -eu
          mkdir -p update-test
          # 0.2.11 has no rate-limit fallback; retry network steps so a shared-runner 403 is not mistaken for a defect.
          retry() { for i in 1 2 3 4 5; do if "$@"; then return 0; fi; echo "retry $i after failure"; sleep 60; done; return 1; }
          base=https://github.com/bacoyc0928-art/research-progress-recorder/releases/download
          # 1. Install the official 0.2.11 app exactly as a user would.
          curl -fsSL -o update-test/old.dmg "$base/v0.2.11/research-progress-recorder-0.2.11-macOS-${{ matrix.arch }}.dmg"
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" update-test/old.dmg >/dev/null
          rm -rf /Applications/ResearchProgressRecorder.app
          ditto "$mnt/ResearchProgressRecorder.app" /Applications/ResearchProgressRecorder.app
          hdiutil detach "$mnt" >/dev/null
          app=/Applications/ResearchProgressRecorder.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 0.2.11
          # 2. Synthetic user data that an update must preserve.
          data="$HOME/Library/Application Support/ResearchProgressRecorder"
          mkdir -p "$data/SRCRec/PersonalWorkspaceSRRec/Mat_Local" "$data/SRCRec/PersonalWorkspaceSRRec/Reference"
          echo 'synthetic progress note' > "$data/SRCRec/PersonalWorkspaceSRRec/Mat_Local/note.txt"
          echo 'synthetic reference' > "$data/SRCRec/PersonalWorkspaceSRRec/Reference/ref.txt"
          echo '{"language":"zh"}' > "$data/config.json"
          (cd "$data" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256) > update-test/data-before.txt
          # 3. The installed 0.2.11 binary's own updater runtime (TLS, release info, checksum, install plan).
          retry "$app/Contents/MacOS/ResearchProgressRecorder" --verify-update-runtime update-test/runtime-0.2.11.json
          cat update-test/runtime-0.2.11.json
          # 4. The exact 0.2.11 "Check updates" code path: find, download, verify, plan.
          mkdir -p update-test/src
          git show v0.2.11:mac-client.py > update-test/src/mac_client_0211.py
          git show v0.2.11:file_channels.py > update-test/src/file_channels.py
          cat > update-test/check_old.py <<'PY'
          import importlib.util, json, pathlib, sys
          sys.path.insert(0,'update-test/src')
          spec=importlib.util.spec_from_file_location('old','update-test/src/mac_client_0211.py')
          old=importlib.util.module_from_spec(spec); spec.loader.exec_module(old)
          assert old.VERSION=='0.2.11', old.VERSION
          rel=old.release_info(); tag=rel['tag_name']
          assert old.version_tuple(tag)>old.version_tuple(old.VERSION), tag
          asset=old.update_asset(rel); assert asset, 'no package for this architecture'
          dmg=old.download_update(rel,asset)       # raises on SHA-256 mismatch
          plan=old.update_install_plan(pathlib.Path('/Applications/ResearchProgressRecorder.app'))
          result=dict(found=tag,asset=asset['name'],downloaded=dmg,checksum_verified=True,plan=plan)
          pathlib.Path('update-test/check-0.2.11.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
          retry python update-test/check_old.py
          # 5. Ad-hoc builds open the verified DMG and ask the user to replace the app; do that step as the user would.
          dmg=$(python -c "import json;print(json.load(open('update-test/check-0.2.11.json'))['downloaded'])")
          test "$(python -c "import json;print(json.load(open('update-test/check-0.2.11.json'))['plan']['reason'])")" = unnotarized-build
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          rm -rf "$app"; ditto "$mnt/ResearchProgressRecorder.app" "$app"
          hdiutil detach "$mnt" >/dev/null
          # 6. Verify the replaced app and the preserved data.
          new=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          codesign --verify --deep --strict "$app"
          retry "$app/Contents/MacOS/ResearchProgressRecorder" --verify-update-runtime update-test/runtime-after.json
          (cd "$data" && find . -type f -print0 | sort -z | xargs -0 shasum -a 256) > update-test/data-after.txt
          diff update-test/data-before.txt update-test/data-after.txt
          python - "$new" <<'PY'
          import json, sys
          check=json.load(open('update-test/check-0.2.11.json')); after=json.load(open('update-test/runtime-after.json'))
          assert sys.argv[1]==check['found'].lstrip('v')==after['version'], (sys.argv[1],check['found'],after['version'])
          summary=dict(from_version='0.2.11',found=check['found'],installed_version=sys.argv[1],checksum_verified=True,
                       install_plan=check['plan']['reason'],user_data_unchanged=True,runtime_after=after)
          open('update-test/summary.json','w').write(json.dumps(summary,indent=2)); print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-test-${{ matrix.arch }}
          path: |
            update-test/*.json
            update-test/*.txt
          if-no-files-found: warn
